name: TrollSign

options:
  bundleIdPrefix: com.no-recovery
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  ZSignApple:
    url: https://github.com/zwsn/zsign-ios
    revision: a7f275fb4830ea48adf536fcddee7d05471970d0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  TrollSign:
    type: application
    platform: iOS
    sources:
      - path: TrollSign
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: TrollSign/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.no-recovery.trollsign
        PRODUCT_NAME: TrollSign
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: ZSignApple
        product: ZSignApple

schemes:
  TrollSign:
    build:
      targets:
        TrollSign: all
    run:
      config: Release
    archive:
      config: Release
